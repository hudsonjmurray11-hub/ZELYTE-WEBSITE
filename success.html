<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Confirmed — ZELYTE</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            background: #0d2357;
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 20px;
        }
        .card {
            background: rgba(255,255,255,0.06);
            border: 1.5px solid rgba(255,255,255,0.15);
            border-radius: 24px;
            padding: 60px 48px;
            max-width: 480px;
        }
        .check {
            font-size: 3rem;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 12px;
        }
        p {
            color: rgba(255,255,255,0.72);
            line-height: 1.6;
            margin-bottom: 32px;
        }
        a {
            display: inline-block;
            background: #fff;
            color: #0d2357;
            font-weight: 700;
            padding: 14px 32px;
            border-radius: 100px;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="check">✓</div>
        <h1>Order Confirmed!</h1>
        <p>Thanks for your order. You'll receive a confirmation email shortly. Welcome to the ZELYTE team.</p>
        <a href="index.html">Back to Home</a>
    </div>
</body>
</html>
