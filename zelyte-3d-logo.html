<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zelyte 3D Logo</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: transparent;
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      will-change: opacity;
    }


  </style>
</head>

<body>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script>
    // Scene
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 7);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.setClearColor(0x000000, 0);
    document.body.appendChild(renderer.domElement);

    // Size the canvas + camera to the current viewport. `setSize` writes inline pixel
    // styles onto the canvas, so if this ever ran with a stale/zero iframe size the logo
    // would get pinned small at the top-left — hence the zero-dimension guard and the
    // re-run hooks below (load + ResizeObserver) that correct any bad first read.
    function resize() {
      const w = window.innerWidth, h = window.innerHeight;
      if (!w || !h) return; // ignore bogus 0-size layout frames
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    }
    resize();

    // Lighting
    scene.add(new THREE.AmbientLight(0xffffff, 0.35));
    const d1 = new THREE.DirectionalLight(0xffffff, 0.9);
    d1.position.set(4, 4, 6);
    scene.add(d1);
    const d2 = new THREE.DirectionalLight(0x5599dd, 0.5);
    d2.position.set(-3, -2, -4);
    scene.add(d2);
    const d3 = new THREE.DirectionalLight(0x88bbff, 0.3);
    d3.position.set(0, 5, -2);
    scene.add(d3);

    // Rotating container — the GLB model is loaded into this group so all
    // downstream spin / fade / drag code keeps operating on `group` unchanged.
    const group = new THREE.Group();
    scene.add(group);

    // Load the 3D logo model (uses its own baked "Zelyte Blue" PBR material).
    const loader = new THREE.GLTFLoader();
    loader.load('images/zelyte-logo-3d.glb', (gltf) => {
      const model = gltf.scene;

      // Center on origin and normalize size to fit the camera (camera is at z=7).
      const box = new THREE.Box3().setFromObject(model);
      const center = box.getCenter(new THREE.Vector3());
      const size = box.getSize(new THREE.Vector3());
      model.position.sub(center);
      const maxDim = Math.max(size.x, size.y, size.z);
      const targetSize = 2.8; // ~matches the old logo's footprint
      if (maxDim > 0) model.scale.setScalar(targetSize / maxDim);

      // Lighten the logo to a softer blue (overrides the GLB's darker baked color).
      model.traverse((o) => {
        if (o.isMesh && o.material) {
          o.material.color.setHex(0x5aa6e6);
        }
      });

      group.add(model);
      modelLoaded = true;
      startTime = null; // begin the spin timer now that the model is visible
    }, undefined, () => {
      // If the model fails to load, don't trap the visitor behind the splash —
      // hand control straight back to the page.
      window.parent.postMessage('splash-done', '*');
    });

    // === INTERACTION & ANIMATION SEQUENCE ===
    let phase = 'spin'; // 'spin' | 'fade' | 'done'
    const spinDuration = 900; // a touch slower than the original 700ms
    const fadeDuration = 250;
    let isDragging = false;
    let prev = { x: 0, y: 0 }, vel = { x: 0, y: 0 };
    let startTime = null;
    let fadeStart = 0;
    let modelLoaded = false;

    function onDown(x, y) { isDragging = true; phase = 'done'; prev = { x, y }; }
    function onMove(x, y) {
      if (!isDragging) return;
      vel.y = (x - prev.x) * 0.005;
      vel.x = (y - prev.y) * 0.005;
      group.rotation.y += vel.y;
      group.rotation.x += vel.x;
      prev = { x, y };
    }
    function onUp() { isDragging = false; }

    const c = renderer.domElement;
    c.addEventListener('mousedown', e => onDown(e.clientX, e.clientY));
    c.addEventListener('mousemove', e => onMove(e.clientX, e.clientY));
    c.addEventListener('mouseup', onUp);
    c.addEventListener('touchstart', e => onDown(e.touches[0].clientX, e.touches[0].clientY));
    c.addEventListener('touchmove', e => onMove(e.touches[0].clientX, e.touches[0].clientY));
    c.addEventListener('touchend', onUp);

    let animRafId = null;
    function animate(now) {
      // Hold the splash (no spin/fade) until the GLB has loaded and is on screen.
      if (!modelLoaded) {
        renderer.render(scene, camera);
        animRafId = requestAnimationFrame(animate);
        return;
      }

      if (startTime === null) startTime = now;

      if (phase === 'spin') {
        const t = Math.min((now - startTime) / spinDuration, 1);
        const eased = 1 - Math.pow(1 - t, 3); // cubic ease-out
        group.rotation.y = eased * Math.PI * 2;
        if (t >= 1) {
          group.rotation.y = 0;
          phase = 'fade';
          fadeStart = now;
        }
      } else if (phase === 'fade') {
        const ft = Math.min((now - fadeStart) / fadeDuration, 1);
        const eased = ft * ft * (3 - 2 * ft); // smoothstep
        c.style.opacity = 1 - eased;
        if (ft >= 1) {
          phase = 'done';
          window.parent.postMessage('splash-done', '*');
          renderer.render(scene, camera);
          return; // stop the loop — splash is finished
        }
      } else if (!isDragging) {
        group.rotation.y += vel.y;
        group.rotation.x += vel.x;
        vel.x *= 0.95;
        vel.y *= 0.95;
      }

      renderer.render(scene, camera);
      animRafId = requestAnimationFrame(animate);
    }
    animRafId = requestAnimationFrame(animate);

    // Re-apply the size whenever layout changes. The ResizeObserver fires the moment the
    // iframe receives its real dimensions, which deterministically closes the load-timing
    // race that intermittently left the logo small in the top-left corner.
    window.addEventListener('resize', resize);
    window.addEventListener('load', resize);
    new ResizeObserver(resize).observe(document.documentElement);


  </script>
</body>

</html>
